name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recon_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/recon_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/recon_demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -v
      - name: Example run
        run: |
          psql postgresql://postgres:postgres@localhost:5432/postgres -c 'CREATE DATABASE recon_demo'
          python -m recon report > /dev/null
          psql "$DATABASE_URL" -f examples/seed.sql
          python -m recon run --provider bank --statement examples/statement.csv --from 2026-10-01 --to 2026-10-02
          python -m recon report
